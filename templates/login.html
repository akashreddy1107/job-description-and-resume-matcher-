<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Resume Analyzer</title>
    <meta name="description" content="HR sign-in for the Resume Analyzer workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #070a0e;
            --bg-surface: #0e1318;
            --bg-surface2: #151c24;
            --border: #2a3544;
            --border-subtle: #1a222c;
            --text-primary: #e8ecf0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-muted: rgba(59, 130, 246, 0.14);
            --accent-ring: rgba(59, 130, 246, 0.22);
            --btn-gradient: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            --danger: #f87171;
            --danger-muted: rgba(248, 113, 113, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 9999px;
            --transition: .2s cubic-bezier(.4, 0, .2, 1);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle grid — professional, not decorative blobs */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 20%, transparent 70%);
        }

        .card {
            position: relative;
            z-index: 10;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 44px 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
            animation: slideUp .5s cubic-bezier(.4, 0, .2, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--bg-surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .logo-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .logo-sub {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            max-width: 280px;
            line-height: 1.45;
        }

        .hr-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-muted);
            border: 1px solid var(--accent-ring);
            border-radius: var(--radius-xl);
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 24px;
        }

        .hr-badge svg {
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color var(--transition);
        }

        .input-wrap input:focus~svg,
        .input-wrap:focus-within svg {
            color: var(--accent);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--bg-surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color var(--transition);
        }

        .toggle-pass:hover {
            color: var(--text-primary);
        }

        .error-alert {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--danger-muted);
            border: 1px solid rgba(248, 113, 113, 0.35);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 20px;
            color: var(--danger);
            font-size: 13px;
            animation: slideUp .25s ease;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius-xl);
            background: var(--btn-gradient);
            color: #f8fafc;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: opacity var(--transition), transform var(--transition);
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: .92;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .card-footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
            line-height: 1.5;
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(248, 250, 252, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo-wrap">
            <div class="logo-mark" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                </svg>
            </div>
            <div class="logo-title">Resume Analyzer</div>
            <div class="logo-sub">Structured screening with blind RAG, semantic chunks, and job-description fit analysis.</div>
        </div>

        <div style="text-align:center;">
            <span class="hr-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                HR access
            </span>
        </div>

        {% if error %}
        <div class="error-alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" id="loginForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" id="username" name="username" placeholder="HR username"
                        autocomplete="username" autofocus required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Password"
                        autocomplete="current-password" required />
                    <button type="button" class="toggle-pass" onclick="togglePass()" title="Show/hide password"
                        id="toggleBtn">
                        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Sign in</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="card-footer">
            Secured workspace · Resume Analyzer<br />
            <a href="mailto:admin@company.com">Contact admin</a> if you need access
        </div>
    </div>

    <script>
        function togglePass() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
            }
        }

        function handleSubmit(e) {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            const ripple = document.createElement('span');
            ripple.style.cssText = 'position:absolute;border-radius:50%;background:rgba(255,255,255,.2);width:0;height:0;left:50%;top:50%;transform:translate(-50%,-50%);animation:ripple .5s linear';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        {% if error %}
        const card = document.querySelector('.card');
        card.style.animation = 'none';
        card.style.animation = 'shake .4s ease';
        {% endif %}
    </script>
    <style>
        @keyframes ripple {
            to {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(6px);
            }
        }
    </style>
</body>

</html>
